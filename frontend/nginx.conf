server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets: safe to cache aggressively
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Avoid stale shell when routes or bundles change
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # SPA: /login, /booking, /mi-reserva, nested paths, and refresh all serve the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
