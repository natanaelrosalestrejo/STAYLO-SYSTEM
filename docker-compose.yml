services:
  backend:
    build:
      context: ./backend
    container_name: staylo_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: staylo_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
